name: Deploy Carbon Game to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp game.html _site/index.html
          cp upstream.html _site/upstream.html
          cp paleoclimate.html _site/paleoclimate.html
          cp experiments.html _site/experiments.html
          cp feedbacks.html _site/feedbacks.html
          cp assessment.html _site/assessment.html
          cp validation.html _site/validation.html
          mkdir -p _site/model _site/data _site/education
          cp model/*.js _site/model/
          cp data/*.js _site/data/
          cp education/*.js _site/education/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
